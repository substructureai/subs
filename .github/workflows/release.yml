name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only, do not publish'
        type: boolean
        default: true

env:
  PNPM_VERSION: 11.0.9
  NODE_VERSION: 24

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            host: macos-15
            platform: darwin-arm64
            bin: subs
          - target: x86_64-apple-darwin
            host: macos-15
            platform: darwin-x64
            bin: subs
          # 22.04 (glibc 2.35) is the oldest runner image; the binary it links
          # runs on anything newer, which the 24.04 image (2.39) would not.
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-22.04
            platform: linux-x64
            bin: subs
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-22.04
            platform: linux-arm64
            bin: subs
            cross: true

    runs-on: ${{ matrix.host }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compile deps (linux-arm64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure cross-compile env (linux-arm64)
        if: matrix.cross
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"

      - name: Install workspace deps
        run: pnpm install --no-frozen-lockfile

      # ── CLI binary build ────────────────────────────────────────────────
      - name: Build CLI binary
        run: cargo build --release --bin subs -p subs --target ${{ matrix.target }}

      - name: Build CLI platform package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(node -p "require('./packages/cli/package.json').version")
          fi
          node scripts/build-cli-platform-package.mjs \
            --target ${{ matrix.target }} \
            --binary target/${{ matrix.target }}/release/${{ matrix.bin }} \
            --version "$VERSION" \
            --out-dir packages/cli/npm/${{ matrix.platform }}

      - name: Upload CLI platform package
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: packages/cli/npm/${{ matrix.platform }}
          if-no-files-found: error

      # ── Release tarball (https://subs.dev/cli.sh) ───────────────────────
      # Asset names carry no version, so `releases/latest/download/<name>`
      # resolves without an API call. Pinning goes through the tag instead.
      - name: Package release tarball
        shell: bash
        run: |
          NAME="subs-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf "dist/$NAME" ${{ matrix.bin }}
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME" > "$NAME.sha256"
          else
            shasum -a 256 "$NAME" > "$NAME.sha256"
          fi

      - name: Upload release tarball
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-24.04
    environment: Publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --no-frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(node -p "require('./packages/cli/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Download CLI platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: packages/cli/npm

      - name: Restore executable bit on CLI binaries
        run: chmod +x packages/cli/npm/*/bin/subs

      - name: Download release tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true

      # ── Publish CLI platform packages and main wrapper ───────────────────
      - name: Publish CLI platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for d in packages/cli/npm/*/; do
            echo "Publishing $d"
            (cd "$d" && npm publish --access public)
          done

      - name: Inject CLI optionalDependencies
        run: node scripts/inject-cli-optional-deps.mjs "${{ steps.version.outputs.version }}"

      - name: Publish CLI main wrapper
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # ── GitHub Release ───────────────────────────────────────────────────
      # Notes come straight from the CHANGELOG section for this version. If the
      # tag has no changelog entry, fall back to GitHub's auto-generated notes.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if NOTES=$(node scripts/changelog-section.mjs "$VERSION"); then
            gh release create "v$VERSION" dist/* --title "v$VERSION" --verify-tag --notes "$NOTES"
          else
            echo "No CHANGELOG section for $VERSION; using auto-generated notes."
            gh release create "v$VERSION" dist/* --title "v$VERSION" --verify-tag --generate-notes
          fi
