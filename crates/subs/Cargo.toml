[package]
name = "subs"
version = "0.9.5"
edition = "2021"
description = "The Substructure command line"
license = "MIT"

[[bin]]
name = "subs"
path = "src/main.rs"

[dependencies]
substructure-host = { path = "../host" }
anyhow = "1"
dialoguer = "0.11"
dirs = "5"
serde_urlencoded = "0.7"
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
async-trait = "0.1.89"
axum = { version = "0.8", features = ["default"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.13.2", features = ["stream", "json", "form"] }
rustyline = "18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v5", "v7"] }
webbrowser = "1"
pulldown-cmark = { version = "0.13.4", default-features = false }
console = "0.16.4"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }

[dev-dependencies]
tempfile = "3"
