[package]
name = "substructure-host"
version = "0.10.1"
edition = "2021"
description = "Runs Substructure sessions: server, providers, connectors and transports"
license = "MIT"

[dependencies]
anyhow = "1"
substructure-session = { path = "../session" }
dirs = "5"
serde_urlencoded = "0.7"
percent-encoding = "2"
toml = "0.8"
async-trait = "0.1.89"
axum = { version = "0.8", features = ["default"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
eventsource-stream = "0.2"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
rand = "0.9"
reqwest = { version = "0.13.2", features = ["stream", "json", "form"] }
rust_decimal = { version = "1.40.0", features = ["serde-with-str"] }
rusqlite = { version = "0.40", features = ["bundled", "unlock_notify", "fallible_uint"] }
sea-query = { version = "1.0.0-rc.1", features = ["derive", "backend-sqlite", "with-chrono", "with-json", "with-uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
sse-stream = "0.2"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v5", "v7"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rmcp = { version = "3.1.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
aes-gcm = "0.10"
shellexpand = "3"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
